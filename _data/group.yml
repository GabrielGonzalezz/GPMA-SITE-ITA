  link_label: ITA graduate admissions
  title_pt: Mestrado e doutorado
  text_pt: Candidate-se ao Programa de Pós-Graduação em Engenharia Aeronáutica e Mecânica. Antes do período de inscrição, escreva ao coordenador com currículo, histórico escolar e uma breve descrição dos seus interesses de pesquisa.
  link_label_pt: Pós-graduação no ITA
- title: Undergraduate research
  text: ITA undergraduates may join ongoing projects in printing, mechanical testing and simulation through the institutional scientific initiation programme (PIBIC/CNPq) or as volunteers.
