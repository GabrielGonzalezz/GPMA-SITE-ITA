# General texts. Fields ending in _pt are the Portuguese (pt-BR) version.
name: GPMA
full_name: Additive Manufacturing Research Group
full_name_pt: Grupo de Pesquisa em Manufatura Aditiva
institution: Instituto Tecnológico de Aeronáutica
institution_short: ITA
division: Mechanical Engineering Division
lab: Aerospace Structures Laboratory
since: 2016
hero_kicker: Aerospace Structures Laboratory · ITA · São José dos Campos, Brazil
hero_text: GPMA investigates how to design, simulate and qualify structures produced by additive manufacturing. Our work spans the mesostructure of extruded material, the mechanics of 3D-printed fibre-reinforced composites, optimal design for manufacturing and laser powder bed fusion for aerospace components.
research_intro: Research at GPMA combines experimental characterisation, multiscale modelling and structural optimisation. We build methods that connect process parameters to material properties and design decisions, and validate them on printed specimens and components.
projects_intro: Ongoing work is funded by FAPESP, CNPq and CAPES and carried out with academic and industrial partners.
people_intro: The group is coordinated by Prof. Rafael Thiago Luiz Ferreira and brings together graduate and undergraduate researchers from ITA's Graduate Program in Aeronautical and Mechanical Engineering.
facilities_intro: GPMA operates polymer and composite printers at the Aerospace Structures Laboratory of ITA's Mechanical Engineering Division, with access to the laboratory's mechanical testing equipment and to computing resources for process and structural simulation.
software_intro: Methods and codes developed by the group, with the publications that describe them.
collab_intro: GPMA works with universities, research institutes and industry in Brazil and abroad through joint projects, co-supervision of graduate students and research stays.
affiliations_intro: Institutions with which GPMA holds research collaborations, and agencies that fund the group's work.
