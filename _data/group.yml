division_pt: Divisão de Engenharia Mecânica
lab_pt: Laboratório de Estruturas Aeroespaciais
hero_statement: Designing, simulating and testing 3D‑printed structures for aerospace.
hero_statement_pt: Projetando, simulando e ensaiando estruturas impressas em 3D para a indústria aeroespacial.
hero_kicker_pt: Laboratório de Estruturas Aeroespaciais · ITA · São José dos Campos
hero_text_pt: O GPMA investiga como projetar, simular e qualificar estruturas produzidas por manufatura aditiva. Nossa pesquisa abrange a mesoestrutura do material extrudado, a mecânica de compósitos reforçados por fibras impressos em 3D, o projeto ótimo para manufatura e a fusão em leito de pó a laser para componentes aeroespaciais.
research_intro_pt: A pesquisa no GPMA combina caracterização experimental, modelagem multiescala e otimização estrutural. Desenvolvemos métodos que conectam parâmetros de processo a propriedades de material e decisões de projeto, validados em corpos de prova e componentes impressos.
projects_intro_pt: Os projetos em andamento são financiados por FAPESP, CNPq e CAPES e desenvolvidos com parceiros acadêmicos e industriais.
people_intro_pt: O grupo é coordenado pelo Prof. Rafael Thiago Luiz Ferreira e reúne pesquisadores de pós-graduação e graduação do Programa de Pós-Graduação em Engenharia Aeronáutica e Mecânica do ITA.
facilities_intro_pt: O GPMA opera impressoras de polímeros e compósitos no Laboratório de Estruturas Aeroespaciais da Divisão de Engenharia Mecânica do ITA, com acesso aos equipamentos de ensaios mecânicos do laboratório e a recursos computacionais para simulação de processos e estruturas.
software_intro_pt: Métodos e códigos desenvolvidos pelo grupo, com as publicações que os descrevem.
collab_intro_pt: O GPMA colabora com universidades, institutos de pesquisa e indústria no Brasil e no exterior por meio de projetos conjuntos, coorientação de alunos de pós-graduação e estágios de pesquisa.
affiliations_intro_pt: Instituições com as quais o GPMA mantém colaborações de pesquisa e agências que financiam o trabalho do grupo.
address_pt: Instituto Tecnológico de Aeronáutica, Divisão de Engenharia Mecânica, Laboratório de Estruturas Aeroespaciais. Praça Marechal Eduardo Gomes, 50, Vila das Acácias, São José dos Campos – SP, 12228-900, Brasil
join_intro_pt: O GPMA admite alunos de pós-graduação pelo Programa de Pós-Graduação em Engenharia Aeronáutica e Mecânica (PG-EAM) do ITA e recebe alunos de iniciação científica do ITA. Recomendamos que os interessados entrem em contato com o coordenador antes de se candidatar.
