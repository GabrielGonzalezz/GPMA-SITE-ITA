# Fields ending in _pt are the Portuguese (pt-BR) version. If empty, the English text is shown.
items:
- title: Continuous-fibre composite printer
  model: Markforged Mark Two
  photo: /assets/img/facilities/markforged-mark-two.jpg
  text: Fused filament fabrication with continuous fibre reinforcement, used for coupons and components in the group's composite research.
  specs:
  - Build volume 320 × 132 × 154 mm
  - Layer height 100–200 µm
  - Continuous carbon, glass and Kevlar® fibre in nylon matrix
  title_pt: Impressora de compósitos com fibra contínua
  text_pt: Fabricação por filamento fundido com reforço de fibra contínua, usada para corpos de prova e componentes na pesquisa em compósitos do grupo.
  specs_pt:
  - Volume de impressão 320 × 132 × 154 mm
  - Altura de camada 100–200 µm
  - Fibra contínua de carbono, vidro e Kevlar® em matriz de náilon
- title: Dual-extrusion printer
  model: GTMax3D Dual
  photo: /assets/img/facilities/gtmax3d-dual.jpg
  text: Two independent extruders for multi-material parts, material interfaces and bimaterial architected structures.
  specs:
  - Build volume 260 × 200 × 180 mm
  - Ø 1.75 mm filament, 0.4 mm nozzle
  - Hotend up to 295 °C, bed up to 130 °C
  - Up to 120 mm/s
  title_pt: Impressora de dupla extrusão
  text_pt: Dois extrusores independentes para peças multimateriais, interfaces entre materiais e estruturas arquitetadas bimateriais.
  specs_pt:
  - Volume de impressão 260 × 200 × 180 mm
  - Filamento Ø 1,75 mm, bico 0,4 mm
  - Hotend até 295 °C, mesa até 130 °C
  - Até 120 mm/s
- title: FFF printer
  model: GTMax3D
  photo: /assets/img/facilities/gtmax3d-core-a2.jpg
  text: Enclosed fused filament fabrication for prototyping and specimen fabrication.
  specs:
  - PLA, PETG, ABS, ASA
  title_pt: Impressora FFF
  text_pt: Fabricação por filamento fundido em câmara fechada para prototipagem e fabricação de corpos de prova.
  specs_pt:
  - PLA, PETG, ABS, ASA
- title: Open-architecture FFF printer
  model: Creality Ender-3
  photo: /assets/img/facilities/creality-ender-3.jpg
  text: Open firmware platform for custom G-code, non-standard deposition strategies and toolpath research.
  specs:
  - Build volume 220 × 220 × 250 mm
  - Ø 1.75 mm filament, 0.4 mm nozzle
  - Layer height 100–400 µm, heated bed
  title_pt: Impressora FFF de arquitetura aberta
  text_pt: Plataforma com firmware aberto para G-code personalizado, estratégias de deposição não convencionais e pesquisa em trajetórias.
  specs_pt:
  - Volume de impressão 220 × 220 × 250 mm
  - Filamento Ø 1,75 mm, bico 0,4 mm
  - Altura de camada 100–400 µm, mesa aquecida
- title: Filament extruder
  model: Filabot Wee
  photo: /assets/img/facilities/filabot-wee.jpg
  text: Single-screw extrusion of custom and recycled filaments from pellets or shredded material.
  specs:
  - Ø 1.75, 2.85 and 3.00 mm filament
  - Up to 350 °C, about 35 rpm
  title_pt: Extrusora de filamentos
  text_pt: Extrusão monorrosca de filamentos personalizados e reciclados a partir de pellets ou material triturado.
  specs_pt:
  - Filamentos Ø 1,75, 2,85 e 3,00 mm
  - Até 350 °C, cerca de 35 rpm
- title: Servo-hydraulic testing machine
  model: Aerospace Structures Laboratory
  photo: /assets/img/facilities/servo-hydraulic.jpg
  text: Mechanical testing of composites, printed materials and structural details.
  specs:
  - Tension, compression (CLC) and in-plane shear
  - ASTM D3039, D6641, D3518, D638
  title_pt: Máquina de ensaios servo-hidráulica
  text_pt: Ensaios mecânicos de compósitos, materiais impressos e detalhes estruturais.
  specs_pt:
  - Tração, compressão (CLC) e cisalhamento no plano
  - ASTM D3039, D6641, D3518, D638
  model_pt: Laboratório de Estruturas Aeroespaciais
